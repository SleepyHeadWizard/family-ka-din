<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064F6E">
<title>Family Ka Din</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Kalam:wght@400;700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette: Sanzo Wada combination 151 (Sulphur Yellow / Vandar Poel's Blue / Yellow Orange).
   Roles: sulphur-tinted neutrals for surfaces (most area), deep blue as primary (~30%),
   yellow-orange only on the one action to press (~10%). Text colours were contrast-checked.
   Dil Ki Baat notes use light tints of the same three hues; text on them is always --ink. */
:root{
  --bg:#FBF8EE;
  --surface:#FFFFFF;
  --sunk:#F5ECC2;
  --ink:#1F1C12;
  --muted:#6B6450;
  --line:#E6DEBE;
  --primary:#064F6E;
  --on-primary:#FFFFFF;
  --accent:#F99D1B;
  --on-accent:#141414;
  --kaam:#064F6E; --khana:#A35A00; --pal:#6E5F10;
  --chit-b:#DDEBF1; --chit-y:#F5ECC2; --chit-p:#FCE3C2;
  --gupt:#3A3527;
  --tape:rgba(255,255,255,.72);
  /* 8-pt spacing scale */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --error:#A3271B;
  --shadow:0 1px 2px rgba(31,28,18,.06),0 6px 18px rgba(31,28,18,.08);
  --display:"Yatra One","Mukta",Georgia,serif;
  --hand:"Kalam","Mukta",cursive;
  --body:"Mukta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hdr:200px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A1810;--surface:#25221A;--sunk:#2F2B20;--ink:#F5ECC2;--muted:#B5AC8E;--line:#3A3527;
    --primary:#8CC4E0;--on-primary:#1A1810;--accent:#F99D1B;--on-accent:#141414;
    --kaam:#8CC4E0;--khana:#F9A43A;--pal:#D9C45A;--error:#F2836F;
    /* Notes stay paper in dark mode: combination 151 hues, lightness lowered a little to avoid glare.
       (Darkened yellow/orange turns brown, which looked muddy.) Text on them uses the paper-ink tokens below. */
    --chit-b:#BCD3DC;--chit-y:#E6DCB0;--chit-p:#EDCDA6;--gupt:#5A5240;--tape:rgba(255,250,230,.5);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 140px;padding-top:env(safe-area-inset-top)}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;margin:0;color:var(--primary);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:15px;flex:none}
.dot{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.modes{display:flex;gap:20px;border-bottom:1.5px solid var(--line)}
.modes button{border:0;background:none;padding:2px 0 8px;margin-bottom:-1.5px;font-size:17px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.modes button[aria-pressed="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.modes .hand{font-family:var(--hand);font-weight:700;font-size:19px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:20px;line-height:1}
.daynav button:disabled{opacity:.35;cursor:default}
.daylabel{text-align:center;display:flex;flex-direction:column}
.daylabel strong{font-size:18px;font-weight:600}
.daylabel span{font-size:14px;color:var(--muted)}

.who{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 6px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px;max-width:74px;font-size:13px;color:var(--muted);line-height:1.2;text-align:center}
.ava{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;outline:2px dashed var(--line);outline-offset:3px;flex:none}
.ava.done{outline:3px solid var(--primary);outline-offset:2px}
.ava .n{position:absolute;right:-6px;bottom:-4px;background:var(--primary);color:var(--on-primary);font-size:12px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.who button.on{color:var(--ink);font-weight:600}
.who button.on .ava{box-shadow:0 0 0 6px var(--sunk)}
.ava.all{background:var(--ink);color:var(--bg);font-size:14px}
.ava.gupt,.dot.gupt{background:var(--gupt)}

.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--muted);margin:6px 0}

.timeline{display:flex;flex-direction:column;gap:18px;margin-top:8px}
.hour{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.rail{position:sticky;top:calc(var(--hdr) + 8px);display:flex;flex-direction:column;align-items:flex-end;padding-top:2px}
.num{font-family:var(--display);font-size:46px;line-height:.9;color:var(--primary);font-variant-numeric:tabular-nums}
.ap{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tod{font-size:13px;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:12px;border-left:2px solid var(--line);padding-left:14px;min-width:0}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:0;padding:0;text-align:left;width:100%}
.card img{display:block;width:100%;max-height:420px;object-fit:cover;background:var(--sunk)}
.meta{display:flex;align-items:center;gap:8px;padding:10px 12px 0;font-size:15px;flex-wrap:wrap}
.nm{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.nm .rel{font-weight:500;color:var(--muted)}
.meta .dot,.chit-top .dot{width:20px;height:20px;font-size:11px}
.meta time{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:13px;font-weight:600;border-radius:999px;padding:1px 9px;border:1.5px solid currentColor}
.t-kaam{color:var(--kaam)}.t-khana{color:var(--khana)}.t-pal{color:var(--pal)}
.cap{margin:4px 12px 0;font-size:16px;overflow-wrap:anywhere}
.card .pad{height:12px}
.imgfail{display:grid;place-items:center;height:160px;background:var(--sunk);color:var(--muted);font-size:14px}

.now .num{color:var(--ink)}
.now .cards{border-left:2px dashed var(--primary)}
.nowbox{border:2px dashed var(--primary);background:var(--sunk);border-radius:14px;padding:16px;text-align:left;width:100%}
.nowbox strong{display:block;font-size:17px}
.nowbox span{color:var(--muted);font-size:15px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* Dil Ki Baat */
.sawaal{display:block;width:100%;text-align:left;border:0;margin:8px 0 4px;padding:14px 16px;border-radius:14px;background:var(--primary);color:var(--on-primary)}
.sawaal small{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.sawaal strong{display:block;font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.3;margin-top:2px}
.sawaal span{display:block;font-size:14px;margin-top:6px;opacity:.85}
.chit{position:relative;border-radius:4px 4px 12px 12px;padding:16px 14px 12px;box-shadow:var(--shadow);transform:rotate(var(--tilt,0deg));background:var(--chit-y)}
.chit::before{content:"";position:absolute;left:50%;top:-9px;width:64px;height:18px;transform:translateX(-50%) rotate(-2deg);background:var(--tape);border:1px solid var(--line);border-radius:2px}
/* Paper ink: everything drawn on a note (or a note-coloured chip/box) uses dark ink in both themes.
   Checked contrast on all six note colours: ink >=10.9, muted >=4.9, deep blue >=5.7, error >=4.7, pill border >=3.1. */
.chit,.compose,.moods-pick input:checked+span{--ink:#1F1C12;--muted:#5A5340;--line:#7A7157;--primary:#064F6E;--error:#A3271B;color:var(--ink)}
.chit.c-b{background:var(--chit-b)}
.chit.c-p{background:var(--chit-p)}
.chit-top{display:flex;align-items:center;gap:8px;font-size:15px;flex-wrap:wrap}
.chit-top time{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.mood{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);opacity:.8}
.chit-q{margin:10px 0 0;font-size:14px;color:var(--muted)}
.chit-body{margin:6px 0 0;font-family:var(--hand);font-size:21px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.reacts{display:flex;gap:10px 8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.reacts .del{margin-left:auto;border:0;background:none;color:var(--muted);text-decoration:underline;padding:3px 2px}
.reacts .del.armed{color:var(--error);font-weight:700}

.collage{display:flex;flex-direction:column;gap:22px;margin-top:8px}
.cl-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cl-head h3{margin:0;font-size:19px;font-weight:700}
.cl-head .cnt{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--sunk);overflow:hidden;border-radius:8px}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ttime{position:absolute;left:5px;bottom:5px;background:rgba(20,18,10,.75);color:#fff;font-size:12px;font-weight:600;padding:0 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.tile .tg{position:absolute;right:5px;top:5px;width:10px;height:10px;border-radius:50%;border:1.5px solid #fff}
.bg-kaam{background:var(--kaam)}.bg-khana{background:var(--khana)}.bg-pal{background:var(--pal)}
.cl-none{color:var(--muted);font-size:15px;padding:6px 2px}

/* Parivaar */
.fam{display:flex;flex-direction:column;gap:18px;margin-top:12px}
.invite{background:var(--primary);color:var(--on-primary);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.invite small{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.invite .code{font-family:var(--display);font-size:40px;letter-spacing:.14em;line-height:1}
.invite p{margin:0;font-size:15px;opacity:.9}
.invite .row a,.invite .row button{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:10px;font-weight:700;border:1.5px solid currentColor;background:transparent;color:inherit}
.invite .row a.wa{background:var(--on-primary);color:var(--primary);border-color:var(--on-primary)}
.sec h3{margin:0 0 4px;font-size:19px}
.sec > p{margin:0 0 10px;color:var(--muted);font-size:15px}
.mrows{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.mrow:first-child{border-top:0}
.mrow .ava{width:42px;height:42px;font-size:16px;outline:0}
.mrow .info{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow .info strong{font-size:17px}
.mrow .info span{font-size:14px;color:var(--muted)}
.mrow .info span b{color:var(--ink);font-weight:600}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chev{color:var(--muted);font-size:20px}
.sugg{background:var(--sunk);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sugg p{margin:0;font-size:16px}
.sugg .row .btn{padding:8px}
.foot{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:15px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.seg{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 0;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.add{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;border-radius:14px;padding:13px 20px;box-shadow:var(--shadow);white-space:nowrap}
.add.wide{flex:1}

/* sheets */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(15,13,8,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:var(--s5) 20px calc(var(--s5) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s4)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--primary)}
.sheet p{margin:0}
.pick{display:grid;place-items:center;min-height:190px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;padding:12px;cursor:pointer;overflow:hidden}
.pick{gap:12px;cursor:default;min-height:150px}
.pick .pw{display:inline-block;max-width:100%}
.pick .pw > img{width:auto;max-width:100%;max-height:300px;border-radius:10px;display:block}
.tags{display:flex;gap:8px;border:0;margin:0;padding:0}
.tags legend{font-size:14px;color:var(--muted);margin-bottom:6px;padding:0}
.tags label{flex:1}
.tags input{position:absolute;opacity:0;pointer-events:none}
.tags span{display:block;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:9px 0;font-weight:600}
.tags input:checked+span{border-color:currentColor;background:var(--sunk)}
.tags input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.moods-pick{flex-wrap:wrap}
.moods-pick legend{width:100%}
.moods-pick label{flex:none}
.moods-pick label span{color:var(--ink);padding:6px 14px;border-radius:999px}
.moods-pick input:checked+span{border-color:var(--ink);border-width:2px}
.moods-pick .c-y input:checked+span{background:var(--chit-y)}
.moods-pick .c-b input:checked+span{background:var(--chit-b)}
.moods-pick .c-p input:checked+span{background:var(--chit-p)}
.starters{display:flex;gap:6px;flex-wrap:wrap}
.starters button{border:1.5px dashed var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:14px;font-family:var(--hand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 13px;font-size:15px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chips button.sug{border-color:var(--primary);border-style:dashed}
.grp{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px}
.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px}
textarea.field{resize:vertical;min-height:130px;font-family:var(--hand);font-size:20px;line-height:1.35}
.compose{border-radius:12px;padding:2px;transition:background .2s}
.compose.c-y{background:var(--chit-y)}.compose.c-b{background:var(--chit-b)}.compose.c-p{background:var(--chit-p)}
.compose textarea{background:transparent;border-color:transparent}
.count{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;margin-top:-8px}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.toggle input{width:20px;height:20px;margin-top:3px;accent-color:var(--primary);flex:none}
.row{display:flex;gap:10px}
.btn{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.warn{color:var(--error);border-color:currentColor}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--error);font-size:15px;min-height:0}
.err:empty{display:none}
.small{font-size:14px;color:var(--muted)}
.linkish{border:0;background:none;padding:0;color:var(--primary);font-weight:600;text-decoration:underline}
.big img{width:100%;border-radius:12px;display:block}

/* onboarding */
.onb{min-height:100vh;max-width:460px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 40px;display:flex;flex-direction:column;gap:18px}
.onb .hero{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.02;margin:24px 0 0;color:var(--primary);text-wrap:balance}
.onb h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:8px 0 0;color:var(--primary);text-wrap:balance}
.onb p{margin:0;color:var(--muted)}
.onb .lead{font-size:18px;color:var(--ink)}
.onb .stack{display:flex;flex-direction:column;gap:10px}
.onb label.lbl{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:-10px}
.onb > .btn{flex:none}
.onb .back{align-self:flex-start;border:0;background:none;color:var(--primary);font-weight:600;padding:0}
.hours{display:flex;gap:6px;align-items:flex-end;height:64px}
.hours i{flex:1;border-radius:6px 6px 2px 2px;background:var(--sunk)}
.hours i.on{background:var(--primary)}
.hours i.acc{background:var(--accent)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--primary)}
.code-in{font-family:var(--display);font-size:30px;letter-spacing:.18em;text-transform:uppercase;text-align:center}
.relrows{display:flex;flex-direction:column;gap:8px}
/* hand-drawn stamps (rough.js draws the ink ring) */
/* Quiet pills by default; the hand-drawn ink ring appears only on the stamps YOU put on, so it means something. */
.stamps{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stamp{position:relative;display:inline-flex;align-items:center;min-height:44px;border:1.5px solid var(--line);border-radius:999px;background:none;padding:6px 14px;font-family:var(--hand);font-weight:700;font-size:15px;line-height:1.2;color:var(--muted)}
.stamp[aria-pressed="true"]{color:var(--primary);border-color:transparent}
.stamp .ink{position:absolute;left:-4px;top:-4px;pointer-events:none;overflow:visible}
.stamp .ink.on path:first-child{opacity:.22}
.stamp > span{position:relative}
.stamp b{font-family:var(--body);font-size:13px;margin-left:6px;font-variant-numeric:tabular-nums}
.chit .stamp{font-size:15px;padding:5px 12px;min-height:38px}
.psum{display:flex;gap:6px 12px;flex-wrap:wrap;padding:8px 12px 0;font-family:var(--hand);font-weight:700;font-size:15px;color:var(--muted)}
.psum span b{font-family:var(--body);font-size:13px;margin-left:3px}
/* doodles over photos */
.pw{position:relative;display:block}
.pw > img{display:block;width:100%}
.card .pw > img{aspect-ratio:4/3;height:auto;max-height:none;object-fit:cover;background:var(--sunk)}  /* same preview frame for every photo; full photo opens on tap */
.pw svg.dd{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* caption written on the photo, over a soft dark fade so it reads on any picture */
.pw .ov{position:absolute;left:0;right:0;bottom:0;padding:36px 14px 12px;background:linear-gradient(to top,rgba(15,13,8,.8),rgba(15,13,8,0));color:#fff;font-family:var(--hand);font-weight:700;font-size:20px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.45);overflow-wrap:anywhere;pointer-events:none;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.pw .ov:empty{display:none}
.big .pw .ov{border-radius:0 0 12px 12px;font-size:22px;-webkit-line-clamp:unset}
.pick .pw .ov{border-radius:0 0 10px 10px;text-align:left}
/* add-photo: camera or gallery */
.src{display:flex;flex-direction:column;gap:10px;width:100%}
.srcbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:14px;font-weight:700;font-size:17px;border:1.5px solid var(--primary);color:var(--primary);cursor:pointer}
.srcbtn.main{background:var(--primary);color:var(--on-primary)}
.srcbtn svg{width:22px;height:22px;flex:none}
.src.mini{flex-direction:row;gap:8px}
.src.mini .srcbtn{flex:1;min-height:44px;font-size:15px;background:none;color:var(--primary)}
.sep{border:0;border-top:1px solid var(--line);margin:0;width:100%}
/* Photo sheet: 8-pt spacing scale. Inside a group 12px (tight: 8px), between groups 24px (proximity rule). */
#vs{display:flex;flex-direction:column;gap:var(--s5)}
.vg{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.vg.tight{gap:var(--s2)}
.vlbl{margin:0;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tool{align-self:flex-start;display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border:1.5px solid var(--primary);border-radius:12px;background:none;color:var(--primary);font-weight:600}
.tool svg{width:20px;height:20px;flex:none}
.vg.foot{gap:var(--s2);align-items:stretch}
.dangerlink{align-self:center;min-height:44px;padding:0 var(--s4);border:0;background:none;color:var(--error);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pw.draw svg#pad{pointer-events:auto;touch-action:none;cursor:crosshair}
.big .pw > img{border-radius:12px}
/* full view: tall photos stay within ~60% of the screen so stamps and comments are visible; box hugs the image so doodles line up */
.big{display:flex;justify-content:center}
.big .pw{display:inline-block;max-width:100%}
.big .pw > img{width:auto;max-width:100%;max-height:60vh;background:var(--sunk)}
.pens{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pens button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.pens button[aria-pressed="true"]{outline:3px solid var(--primary);outline-offset:2px}
.ddlist{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* comments */
.cmts{display:flex;flex-direction:column;gap:12px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt .dot{margin-top:2px}
.cmt div{flex:1;min-width:0}
.cmt b{font-weight:600}
.cmt .rel{color:var(--muted)}
.cmt time{color:var(--muted);font-size:13px;margin-left:6px}
.cmt p{margin:2px 0 0;overflow-wrap:anywhere}
.cmt .x{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
/* nishaan */
.ava svg.mark,.dot svg.mark{width:80%;height:80%;display:block}
.markpad{width:220px;height:220px;border-radius:50%;margin:0 auto;position:relative;touch-action:none}
.markpad svg{width:100%;height:100%;display:block;cursor:crosshair}
.nudge{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px dashed var(--primary);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.nudge strong{display:block}
.nudge span{font-size:14px;color:var(--muted)}
/* install */
.install{display:flex;gap:12px;align-items:center;background:var(--sunk);border-radius:14px;padding:12px 14px;margin:8px 0 4px}
.install img{width:44px;height:44px;border-radius:10px;flex:none}
.install div{flex:1;min-width:0}
.install strong{display:block;font-size:16px}
.install span{font-size:14px;color:var(--muted)}
.install .btn{flex:none;padding:9px 14px}
.install .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px;flex:none}
.steps-list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
/* celebration */
.cele{margin:10px 0 2px;text-align:center;font-family:var(--hand);font-weight:700;font-size:22px;color:var(--ink)}
.cele span{padding:0 6px}
/* activity toast: one line about what someone else just did; tap to go there */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;
  width:min(480px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:16px;
  background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow);text-align:left;font-size:16px;line-height:1.3}
.toast[hidden]{display:none}
.toast .ic{font-size:22px;flex:none}
.toast .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.toast .go{flex:none;font-weight:700;font-size:14px;opacity:.85}

@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease-out}
  .toast{animation:tin .25s ease-out}
  @keyframes tin{from{transform:translate(-50%,-16px);opacity:0}to{transform:translateX(-50%);opacity:1}}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion: reduce){ .chit{transform:none} }

  const VAAR = ["Ravivar","Somvar","Mangalvar","Budhvar","Guruvar","Shukravar","Shanivar"];

  const sawaalFor = k => { const n = Math.floor(parseDay(k).getTime()/864e5); return SAWAAL[((n % SAWAAL.length) + SAWAAL.length) % SAWAAL.length]; };

  const REL_GROUPS = [

  inv(["Didi","Bhaiya","Behen","Bhai"], "Bhai", "Behen");
  inv(["Pati"], null, "Patni"); inv(["Patni"], "Pati", null);

  inv(["Bahu","Damad"], "Sasur", "Saas");

  const inverseOf = (label, ownerGender) => { const e = INV[label]; return e && ownerGender ? e[ownerGender] : null; };

  const COLORS = ["#A35A00","#064F6E","#6E5F10","#1F6F93","#7A4A00","#4A4010"];

  /* ================= state ================= */
  const cfg = window.FAMILY_CONFIG || {};
  const S = {
    sb:null, fam:null, members:[], rel:{}, relIn:[], me: ls.get("fkd-me"),
    mode: ["dil","parivaar"].includes(ls.get("fkd-mode")) ? ls.get("fkd-mode") : "photos",
    day: todayKey(), posts:[], conf:[], reacts:[], preacts:[], comments:[], doodles:[], view:"timeline", filter:"all",

  const member = id => S.members.find(m => m.id === id);

  const photoUrl = path => S.sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
  // Untrusted drawing data from the database: only allow plain path syntax.

  /* ---------- hand-drawn bits ---------- */
  const PHOTO_STAMPS = [["wah","Wah!"],["nazar","Nazar na lage"],["bhook","Bhook lag gayi"],["shabaash","Shabaash"],["dil","Dil se"]];

    const len = pts.length; if (len < 4) return "";

    for (let i = 2, max = len - 1; i < max; i++) { a = pts[i]; b = pts[i + 1]; r += `${avg(a[0], b[0]).toFixed(0)},${avg(a[1], b[1]).toFixed(0)} `; }

  async function drawPad(svg, w, h, opts){
    const { getStroke } = await loadPF();

    const make = () => { const p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("fill", opts.color()); svg.appendChild(p); return p; };

  }
  const doodleSVG = dd => okVb(dd.vb) ? `<svg class="dd" viewBox="0 0 ${dd.vb}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${(dd.strokes || []).filter(s => okPath(s.d)).map(s => `<path d="${s.d}" fill="${okColor(s.c) ? s.c : "#FFFFFF"}"/>`).join("")}</svg>` : "";

  function celebrate(){

  /* ================= sounds & alerts =================

  const alertsMode = () => ["all","quiet","off"].includes(ls.get("fkd-alerts")) ? ls.get("fkd-alerts") : "all";
  const SFX = (() => {
    let ctx = null, out = null;
    const ac = () => {
      if (!ctx) {

      osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + o.dur + .03);
    }
    function noise(c, t, o){
      o = Object.assign({ dur:.05, vol:.2, filter:"highpass", f:2500, q:1 }, o);
      const n = Math.max(1, Math.floor(c.sampleRate * o.dur)), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
      src.buffer = buf; fl.type = o.filter; fl.Q.value = o.q; fl.frequency.setValueAtTime(o.f, t);

    const bell = (c, t, f, dur = .6, vol = .16) => { tone(c, t, f, { dur, vol }); tone(c, t, f * 2.76, { dur: dur * .5, vol: vol * .25 }); };

    const KINDS = {
      // camera shutter (two blade clicks), then a bright two-note chime
      photo(c, t){ noise(c, t, { dur:.03, vol:.35, f:3200 }); noise(c, t + .07, { dur:.045, vol:.28, f:2200 }); bell(c, t + .16, 1318.5, .5); bell(c, t + .26, 1975.5, .7); },
      // dhak-dhak heartbeat, then a warm soft note
      dil(c, t){ tone(c, t, 95, { to:50, dur:.15, vol:.55 }); tone(c, t + .2, 85, { to:45, dur:.17, vol:.42 }); tone(c, t + .48, 659.3, { type:"triangle", dur:.7, vol:.11 }); tone(c, t + .48, 987.8, { dur:.8, vol:.06 }); },
      // rubber stamp hitting paper: a low thud with a papery tick
      stamp(c, t){ tone(c, t, 190, { to:55, dur:.13, vol:.6, att:.002 }); noise(c, t, { dur:.07, vol:.3, filter:"lowpass", f:1400 }); },
      // bubbly pop for a reaction on a note
      react(c, t){ tone(c, t, 380, { to:980, dur:.09, vol:.28, att:.003 }); tone(c, t + .1, 1567.98, { dur:.12, vol:.07 }); },
      // "ting-ting", like a message arriving
      comment(c, t){ tone(c, t, 784, { type:"triangle", dur:.16, vol:.2 }); tone(c, t + .13, 1046.5, { type:"triangle", dur:.3, vol:.2 }); },
      // pen scribble: two quick swishes of filtered noise
      doodle(c, t){ noise(c, t, { dur:.17, vol:.28, filter:"bandpass", f:900, to:2600, q:2.5 }); noise(c, t + .19, { dur:.15, vol:.22, filter:"bandpass", f:2400, to:1000, q:2.5 }); },
      // dhol-like double beat, then a welcoming chime: someone joined
      join(c, t){ tone(c, t, 130, { to:70, dur:.18, vol:.5 }); tone(c, t + .2, 130, { to:70, dur:.18, vol:.5 }); bell(c, t + .38, 783.99); bell(c, t + .5, 1046.5, .8); },
      // rising bell arpeggio: the whole family posted today

      play(kind){

  const VIBE = { photo:[60,40,60], dil:[90,110,90], stamp:[80], react:[30], comment:[40,60,40], doodle:[20,30,20,30,20], join:[100,60,100] };
  const ALERT_ICON = { photo:"📷", dil:"💌", comment:"💬", doodle:"✏️", stamp:"🌟", react:"❤️", join:"🎉" };
  // When several things arrive together, the most important one sets the sound and the message.
  const ALERT_ORDER = ["photo","dil","join","comment","doodle","stamp","react"];

  const toastEl = () => $("#toast");
  let toastTimer = null, toastEv = null;
  function hideToast(){ clearTimeout(toastTimer); const t = toastEl(); if (t) t.hidden = true; toastEv = null; }
  function showToast(ev, text){
    const t = toastEl(); if (!t) return;
    toastEv = ev;
    t.innerHTML = `<span class="ic" aria-hidden="true">${ALERT_ICON[ev.kind] || "🔔"}</span><span class="tx">${esc(text)}</span><span class="go">Dekho</span>`;

    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6000);
  }
  async function goToEvent(ev){
    hideToast(); if (!ev || !S.sb || $("#app").hidden) return;

    if (S.day !== todayKey()) { S.day = todayKey(); S.filter = "all"; await loadDay(); }

  }
  $("#toast").addEventListener("click", () => goToEvent(toastEv));

  const canSysNotify = () => alertsMode() !== "off" && "Notification" in window && Notification.permission === "granted" && "serviceWorker" in navigator;

  }

  function activityOf(){
    const evs = [];

  /* ================= backend ================= */

      showOnb(`
        ${stepBar(3)}
        <h2>Aapke liye kaun kya hai?</h2>
        <p class="lead">Har kisi ke liye apna rishta chuno. Yeh sirf aapko dikhega: aapki Didi, Mummy ki beti hai.</p>
        <div class="mrows" id="rl">${others().map(relRowHTML).join("")}</div>
        <div class="stack">
          <button type="button" class="btn go" id="done">Ho gaya, app kholo</button>
          <button type="button" class="linkish" id="skip" style="align-self:center">Baad mein karunga</button>
        </div>`);
      $("#rl").onclick = e => { const b = e.target.closest("[data-rel]"); if (b) relSheet(b.dataset.rel, draw); };
      $("#done").onclick = () => startApp();
      $("#skip").onclick = () => startApp();
    };
    draw();
  }

  function relRowHTML(m){
    const r = S.rel[m.id];
    const given = S.relIn.find(x => x.owner === m.id);
    const sug = !r && given ? inverseOf(given.label, m.gender) : null;
    return `<button type="button" class="mrow" data-rel="${esc(m.id)}">
      <span class="ava" style="background:${esc(m.color)}">${avaInner(m.id)}</span>
      <span class="info"><strong>${esc(m.name)}</strong>
        <span>${r ? `Mere liye: <b>${esc(r)}</b>` : sug ? `Suggestion: <b>${esc(sug)}</b>` : "Rishta chuno"}${!m.claimed ? " · abhi juda nahi" : ""}</span></span>
      <span class="chev" aria-hidden="true">›</span></button>`;
  }

  /* ================= boot ================= */
  async function boot(){
    if (!window.supabase || !cfg.supabaseUrl || cfg.supabaseUrl.includes("YOUR-PROJECT")) {
      showOnb(`<h1 class="hero">Family Ka Din</h1><p class="lead">App abhi set up nahi hua hai. config.js mein Supabase ka URL aur key daalo (README dekho).</p>`);
      return;
    }
    let join = null;
    try { join = new URLSearchParams(location.search).get("join"); } catch {}
    const code = ls.get("fkd-code");
    if (join && (!code || join.toUpperCase() !== code)) {
      try { history.replaceState(null, "", location.pathname); } catch {}
      return onbJoin(join.toUpperCase());
    }
    if (!code) return onbWelcome();
    try {
      const r = await familyFor(code);
      if (!r) { ls.del("fkd-code"); ls.del("fkd-me"); return onbWelcome(); }
      S.sb = r.sb; S.fam = r.fam;
      await loadMembers();
      const me = meM();
      if (!me) { S.me = null; ls.del("fkd-me"); return onbWho(false); }
      await loadRelations();
      startApp();
    } catch {
      showOnb(`<h1 class="hero">Family Ka Din</h1><p class="lead">Net nahi mil raha.</p><button type="button" class="btn go" id="retry">Dobara try karo</button>`);
      $("#retry").onclick = boot;
    }
  }

  function startApp(mode){
    if (mode) { S.mode = mode; ls.set("fkd-mode", mode); }
    onb.hidden = true; $("#app").hidden = false;
    $("#famName").textContent = S.fam.name;
    try { if (hstate()) history.replaceState(null, ""); if (S.mode !== "photos") history.pushState({ fkd:"tab" }, ""); } catch {}
    loadDay();
    if (!S.started) {
      S.started = true;
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
      S.poll = setInterval(async () => {
        if ($("#app").hidden || (document.hidden && !canSysNotify())) return;
        await loadMembers(); loadDay(true);
      }, 30000);
      document.addEventListener("visibilitychange", async () => {
        if (document.hidden || $("#app").hidden) return;
        await loadMembers(); await loadRelations(); loadDay(true);
      });
      new ResizeObserver(() => document.documentElement.style.setProperty("--hdr", $("#hdr").offsetHeight + "px")).observe($("#hdr"));
    }
  }

  /* ================= render ================= */
  function renderHeader(){
    const me = meM();
    $("#meDot").style.background = me ? me.color : "var(--muted)";
    $("#meDot").innerHTML = me ? avaInner(me.id) : "?";
    $("#meName").textContent = me ? me.name : "";
    const d = parseDay(S.day), isToday = S.day === todayKey();
    const yest = S.day === shiftDay(todayKey(), -1);
    $("#dayTitle").textContent = isToday ? "Aaj" : yest ? "Kal" : VAAR[d.getDay()];
    $("#daySub").textContent = `${VAAR[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;
    $("#nextDay").disabled = isToday;
    $("#mPhotos").setAttribute("aria-pressed", S.mode==="photos");
    $("#mDil").setAttribute("aria-pressed", S.mode==="dil");
    $("#mFam").setAttribute("aria-pressed", S.mode==="parivaar");

    const fam = S.mode === "parivaar", dil = S.mode === "dil";
    $("#daynav").hidden = fam; $("#who").hidden = fam;
    $("#seg").hidden = dil || fam;
    $("#addBtn").textContent = fam ? "+ Kisi ko parivaar mein jodo" : dil ? "+ Dil ki baat likho" : "+ Photo";
    $("#addBtn").classList.toggle("wide", dil || fam);
    $("#vTimeline").setAttribute("aria-pressed", S.view==="timeline");
    $("#vCollage").setAttribute("aria-pressed", S.view==="collage");
    if (fam) return;

    const items = dil ? S.conf : S.posts;
    const counts = {}; let gupt = 0;
    items.forEach(p => { if (p.member) counts[p.member] = (counts[p.member]||0)+1; else gupt++; });
    let h = `<button type="button" data-act="filter" data-k="all" class="${S.filter==="all"?"on":""}" aria-pressed="${S.filter==="all"}"><span class="ava all">Sab</span>${items.length} ${dil?(items.length===1?"baat":"baatein"):"photo"}</button>`;
    const ordered = [...S.members.filter(m => m.id === S.me), ...others()];
    ordered.forEach(m => {
      const n = counts[m.id]||0, on = S.filter===m.id;
      h += `<button type="button" data-act="filter" data-k="${esc(m.id)}" class="${on?"on":""}" aria-pressed="${on}"><span class="ava ${n?"done":""}" style="background:${esc(m.color)}">${avaInner(m.id)}${n?`<span class="n">${n}</span>`:""}</span>${esc(mLabel(m.id))}</button>`;
    });
    if (dil && gupt) {
      const on = S.filter === "gupt";
      h += `<button type="button" data-act="filter" data-k="gupt" class="${on?"on":""}" aria-pressed="${on}"><span class="ava gupt done">?<span class="n">${gupt}</span></span>Gupt</button>`;
    }
    $("#who").innerHTML = h;
  }

  function renderNotes(){
    $("#notes").innerHTML = S.offline && S.mode !== "parivaar" ? `<p class="note">Net nahi mil raha, isliye naya kuch nahi dikh raha. Net aate hi khud update ho jayega.</p>` : "";
  }

  const byFilter = list => S.filter==="all" ? list : S.filter==="gupt" ? list.filter(p => !p.member) : list.filter(p => p.member === S.filter);
  const img = (p, alt) => `<img src="${esc(photoUrl(p.path))}" alt="${esc(alt)}" loading="lazy" data-fail>`;

  function photoSummary(p){
    const rx = S.preacts.filter(r => r.post_id === p.id);
    const bits = PHOTO_STAMPS.map(([k, l]) => { const n = rx.filter(r => r.kind === k).length; return n ? `<span>${esc(l)}<b>${n}</b></span>` : ""; }).filter(Boolean);
    const nc = S.comments.filter(c => c.post_id === p.id).length;
    const nd = S.doodles.filter(d => d.post_id === p.id).length;
    if (nc) bits.push(`<span>${nc} ${nc === 1 ? "jawab" : "jawab"}</span>`);
    if (nd) bits.push(`<span>${nd} doodle</span>`);
    return bits.length ? `<div class="psum">${bits.join("")}</div>` : "";
  }
  function photoHTML(p, alt){
    return `<span class="pw">${img(p, alt)}${S.doodles.filter(d => d.post_id === p.id && !S.hideDoodles).map(doodleSVG).join("")}${p.caption ? `<span class="ov">${esc(p.caption)}</span>` : ""}</span>`;
  }
  function cardHTML(p){
    return `<button type="button" class="card" data-act="open" data-id="${esc(p.id)}">
      ${photoHTML(p, `${TAGS[p.tag]||"Pal"}, ${mName(p.member)}`)}
      <div class="meta">${whoHTML(p.member)}<span class="tag t-${esc(p.tag||"pal")}">${esc(TAGS[p.tag]||"Pal")}</span><time>${tstr(p.ts)}</time></div>
      ${photoSummary(p)}<div class="pad"></div></button>`;
  }

  function chitHTML(c, i){
    const tilt = [-0.8, 0.6, -0.4, 0.9][i % 4];
    const who = c.member ? whoHTML(c.member) : `<span class="nm"><span class="dot gupt">?</span>Gupt</span>`;
    const rx = S.reacts.filter(r => r.confession_id === c.id);
    const canDel = (c.member && c.member === S.me) || mine.has(c.id);
    const btns = REACTS.map(([k, label]) => {
      const n = rx.filter(r => r.kind === k).length;
      const meOn = rx.some(r => r.kind === k && r.member === S.me);
      return `<button type="button" class="stamp" data-act="react" data-id="${esc(c.id)}" data-k="${k}" aria-pressed="${meOn}"><span>${label}${n?`<b>${n}</b>`:""}</span></button>`;
    }).join("");
    const md = MOODS[c.mood] || MOODS.yunhi;
    const label = c.mood === "custom" ? (c.mood_label || "Kuch aur") : md[0];
    return `<article class="chit c-${md[1]}" style="--tilt:${tilt}deg">
      <div class="chit-top">${who}<span class="mood">${esc(label)}</span><time>${tstr(c.ts)}</time></div>
      ${c.prompt?`<p class="chit-q">Aaj ka sawaal: ${esc(c.prompt)}</p>`:""}
      <p class="chit-body">${esc(c.body)}</p>
      <div class="reacts">${btns}${canDel?`<button type="button" class="del" data-act="delchit" data-id="${esc(c.id)}">Hatao</button>`:""}</div>
    </article>`;
  }

  function timelineOf(list, cardFn, nowText){
    const isToday = S.day === todayKey();
    const groups = {};
    list.forEach(p => { const h = new Date(p.ts).getHours(); (groups[h] = groups[h] || []).push(p); });
    const rows = Object.keys(groups).map(Number).map(h => ({ h, key:h, items:groups[h] }));
    const nowH = new Date().getHours();
    if (isToday) rows.push({ h:nowH, key:nowH+0.5, now:true });
    rows.sort((a,b) => a.key-b.key);
    if (!rows.length) return "";
    const nobody = !list.length && !S.loading;
    let i = 0;
    return `<div class="timeline">${rows.map(r => r.now ? `
      <section class="hour now">
        <div class="rail"><span class="num">${h12(r.h)}</span><span class="ap">${ap(r.h)}</span><span class="tod">abhi</span></div>
        <div class="cards"><button type="button" class="nowbox" data-act="add">
          <strong>${nobody ? nowText[0] : nowText[1]}</strong><span>${nowText[2]}</span></button></div>
      </section>` : `
      <section class="hour">
        <div class="rail"><span class="num">${h12(r.h)}</span><span class="ap">${ap(r.h)}</span><span class="tod">${tod(r.h)}</span></div>
        <div class="cards">${r.items.map(x => cardFn(x, i++)).join("")}</div>
      </section>`).join("")}</div>`;
  }

  function everyonePosted(){
    const joined = S.members.filter(m => m.claimed);
    return S.day === todayKey() && joined.length >= 2 && joined.every(m => S.posts.some(p => p.member === m.id));
  }
  function renderPhotos(){
    const cele = installCard(true) + (everyonePosted() ? `<p class="cele"><span id="celeTxt">Aaj poore parivaar ne photo daali!</span></p>` : "");
    if (S.view === "collage") return cele + renderCollage();
    const list = byFilter(S.posts);
    const t = timelineOf(list, cardHTML, ["Aaj ki pehli photo aap daalo","Is waqt kya chal raha hai?","Kaam, khana, ya bas koi pal. Jab fursat mile, ek photo."]);
    return cele + (t || `<p class="empty">${S.loading ? "Load ho raha hai…" : S.filter==="all" ? "Is din koi photo nahi daali gayi." : `${esc(mLabel(S.filter))} ne is din koi photo nahi daali.`}</p>`);
  }

  function renderDil(){
    const list = byFilter(S.conf);
    const head = `<button type="button" class="sawaal" data-act="sawaal"><small>Aaj ka sawaal</small><strong>${esc(sawaalFor(S.day))}</strong><span>Mann ho toh jawab likho, warna bas padh lo.</span></button>`;
    const t = timelineOf(list, chitHTML, ["Aaj ki pehli dil ki baat aap likho","Kuch dil mein hai?","Yaadein, khushkhabri, shikayat, ya bas yunhi. Naam ke saath ya gupt."]);
    return head + (t || `<p class="empty">${S.loading ? "Load ho raha hai…" : "Is din kisi ne kuch nahi likha."}</p>`);
  }

  function renderCollage(){
    const all = [...S.members.filter(m => m.id === S.me), ...others()];
    const ms = S.filter==="all" ? all : all.filter(m => m.id===S.filter);
    if (!ms.length) return `<p class="empty">${S.loading ? "Load ho raha hai…" : "Parivaar tab se logon ko jodo."}</p>`;
    return `<div class="collage">${ms.map(m => {
      const ps = S.posts.filter(p => p.member === m.id);
      const title = m.id === S.me ? "Aapka din" : `${esc(mLabel(m.id))} ka din`;
      return `<section>
        <div class="cl-head">${dotHTML(m.id)}<h3>${title}</h3><span class="cnt">${ps.length} photo</span></div>
        ${ps.length ? `<div class="grid">${ps.map(p => `<button type="button" class="tile" data-act="open" data-id="${esc(p.id)}" aria-label="${esc((TAGS[p.tag]||"Pal")+", "+tstr(p.ts))}">
          ${img(p, (TAGS[p.tag]||"Pal")+", "+m.name)}<span class="ttime">${tstr(p.ts)} ${ap(new Date(p.ts).getHours())}</span><span class="tg bg-${esc(p.tag||"pal")}"></span></button>`).join("")}</div>`
        : `<p class="cl-none">Abhi tak kuch nahi daala.</p>`}
      </section>`;
    }).join("")}</div>`;
  }

  /* ---------- install as app ---------- */
  let installEvt = null;
  const isStandalone = () => !!(navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches));
  const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; render(); });
  window.addEventListener("appinstalled", () => { installEvt = null; ls.set("fkd-installed", "1"); render(); });
  const showInstall = () => !isStandalone() && ls.get("fkd-installed") !== "1";
  function installCard(dismissable){
    if (!showInstall()) return "";
    if (dismissable && ls.get("fkd-install-x") === "1") return "";
    return `<div class="install"><img src="icon-192.png" alt="" onerror="this.remove()"><div><strong>App ki tarah install karo</strong><span>Home screen pe icon aa jayega, bina browser ke khulega.</span></div>
      <button type="button" class="btn pri" data-act="install">Install</button>${dismissable ? `<button type="button" class="x" data-act="installx" aria-label="Band karo">×</button>` : ""}</div>`;
  }
  async function doInstall(){
    if (installEvt) {
      installEvt.prompt();
      try { const r = await installEvt.userChoice; if (r.outcome === "accepted") ls.set("fkd-installed", "1"); } catch {}
      installEvt = null; render(); return;
    }
    const ios = isIOS();
    openSheet(`<h2>App install karo</h2>
      ${ios ? `<ol class="steps-list">
          <li>Yeh page <b>Safari</b> mein kholo.</li>
          <li>Neeche <b>Share</b> button dabao (dabba jisme upar teer hai).</li>
          <li>Neeche scroll karke <b>Add to Home Screen</b> chuno, phir <b>Add</b>.</li>
          <li>Ab home screen pe Family Ka Din ke icon se kholo. Reminder bhi tabhi chalenge.</li></ol>`
        : `<ol class="steps-list">
          <li>Yeh page <b>Chrome</b> mein kholo.</li>
          <li>Upar daayein <b>⋮</b> (teen bindu) dabao.</li>
          <li><b>Install app</b> ya <b>Add to Home screen</b> chuno, phir <b>Install</b>.</li>
          <li>Ab app drawer ya home screen se Family Ka Din kholo.</li></ol>`}
      <button type="button" class="btn" data-close>Samajh gaya</button>`);
    sheet.querySelector("[data-close]").onclick = closeSheet;
  }

  const REMIND = [["Band", null], ["Subah 9", 9], ["Dopahar 1", 13], ["Shaam 6", 18], ["Raat 9", 21]];
  const inviteLink = () => `${location.origin}${location.pathname}?join=${encodeURIComponent(S.fam.code)}`;

  function renderParivaar(){
    const me = meM();
    const link = inviteLink();
    const wa = "https://wa.me/?text=" + encodeURIComponent(`${S.fam.name} mein judo! Family Ka Din app kholo: ${link}\nCode: ${S.fam.code}`);
    const sugg = S.relIn.map(r => {
      const owner = member(r.owner); if (!owner || S.rel[owner.id]) return null;
      const s = inverseOf(r.label, owner.gender); if (!s) return null;
      return { owner, given:r.label, s };
    }).filter(Boolean);
    const joined = others().filter(m => m.claimed), waiting = others().filter(m => !m.claimed);
    return `<div class="fam">
      ${installCard(false)}
      <section class="invite">
        <small>Parivaar ka code</small>
        <div class="code">${esc(S.fam.code)}</div>
        <p>Yeh code ya link bhejo. Jo bhi kholega, ${esc(S.fam.name)} mein jud jayega.</p>
        <div class="row"><a class="wa" href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp pe bhejo</a><button type="button" data-act="copylink">Link copy karo</button></div>
      </section>

      ${sugg.map(x => `<section class="sugg">
        <p><b>${esc(x.owner.name)}</b> ne aapko <b>${esc(x.given)}</b> kaha hai. Aapke liye ${esc(x.owner.name)}: <b>${esc(x.s)}</b>?</p>
        <div class="row"><button type="button" class="btn pri" data-act="acceptrel" data-id="${esc(x.owner.id)}" data-l="${esc(x.s)}">Haan, ${esc(x.s)}</button><button type="button" class="btn" data-act="relpick" data-id="${esc(x.owner.id)}">Kuch aur</button></div>
      </section>`).join("")}

      ${!me.mark ? `<button type="button" class="nudge" data-act="drawmark"><span class="ava" style="background:${esc(me.color)};outline:0">${esc(initial(me.name))}</span><span><strong>Apna nishaan banao</strong><span>Ungli se kuch bhi bana do: signature, dil, chashma. Har jagah aapke naam ke saath yahi dikhega.</span></span></button>` : ""}

      <section class="sec">
        <h3>Aap</h3>
        <div class="mrows"><button type="button" class="mrow" data-act="editme">
          <span class="ava" style="background:${esc(me.color)}">${avaInner(me.id)}</span>
          <span class="info"><strong>${esc(me.name)}</strong><span>Naam, nishaan ya jaankari badlo</span></span>
          <span class="chev" aria-hidden="true">›</span></button></div>
      </section>

      <section class="sec">
        <h3>Mera parivaar</h3>
        <p>Har kisi ke aage apna rishta likho. Yeh sirf aapke phone pe aapko dikhega, baaki sab apna-apna rakhenge.</p>
        ${joined.length ? `<div class="mrows">${joined.map(m => relRowHTML(m).replace('data-rel=', 'data-act="relpick" data-id=')).join("")}</div>` : `<p class="small">Abhi aur koi nahi juda. Upar se code bhejo.</p>`}
      </section>

      ${waiting.length ? `<section class="sec">
        <h3>Abhi juda nahi</h3>
        <p>Inhe aapne ya kisi aur ne pehle se joda hai. Jab yeh app kholenge, apna naam chun lenge.</p>
        <div class="mrows">${waiting.map(m => relRowHTML(m).replace('data-rel=', 'data-act="relpick" data-id=')).join("")}</div>
      </section>` : ""}

      <section class="sec">
        <h3>Roz yaad dilao</h3>
        <p>Agar tab tak aapne kuch nahi daala, ek chhota sa message aayega, aapke rishton ke saath: "Mummy ne aaj 2 photo daali…"</p>
        <div class="chips">${REMIND.map(([l, h]) => `<button type="button" data-act="remind" data-h="${h ?? ""}" aria-pressed="${(me.remind_at ?? null) === h}">${l}</button>`).join("")}</div>
        <p class="small" id="rnote" style="margin-top:8px">${esc(S.remindNote || "")}</p>
      </section>

      <section class="sec">
        <h3>Awaaz aur alert</h3>
        <p>Jab koi photo daale, dil ki baat likhe, aapki photo pe stamp lagaye ya jawab de, toh upar ek chhota sa message aayega. Har baat ki apni alag awaaz hai.</p>
        <div class="chips">${[["all","Awaaz ke saath"],["quiet","Bina awaaz"],["off","Band"]].map(([v, l]) => `<button type="button" data-act="alerts" data-v="${v}" aria-pressed="${alertsMode() === v}">${l}</button>`).join("")}</div>
        ${alertsMode() === "all" ? `<p class="small" style="margin:12px 0 8px">Sun ke dekho:</p>
        <div class="chips">${[["photo","📷 Nayi photo"],["dil","💌 Dil ki baat"],["comment","💬 Jawab"],["stamp","🌟 Stamp"],["react","❤️ Reaction"],["doodle","✏️ Doodle"],["join","🎉 Koi juda"],["cele","🎊 Sabne daali"]].map(([k, l]) => `<button type="button" data-act="sfx" data-k="${k}">${l}</button>`).join("")}</div>
        <p class="small" style="margin-top:8px">Awaaz na aaye toh phone ka volume aur silent switch dekho.</p>` : ""}
      </section>

      <section class="foot">
        <button type="button" class="linkish" data-act="renamefam">Parivaar ka naam badlo</button>
        <button type="button" class="linkish" data-act="switchuser">Is phone pe koi aur hai? User badlo</button>
        <button type="button" class="linkish" data-act="leavefam">Doosre parivaar mein jao</button>
        <button type="button" class="linkish" data-act="leaveself" style="color:var(--error)">Parivaar chhodo aur apna naam hatao</button>
      </section>
    </div>`;
  }

  function render(){
    if (!S.sb || $("#app").hidden) return;
    renderHeader(); renderNotes();
    $("#main").innerHTML = S.mode === "parivaar" ? renderParivaar() : S.mode === "dil" ? renderDil() : renderPhotos();
    decorateStamps($("#main"));
    const ct = $("#celeTxt");
    if (ct) {
      annotate(ct, "cele" + S.day, { type:"highlight", color:"rgba(249,157,27,.35)", iterations:1, multiline:true });
      const k = "fkd-cele-" + S.day + "-" + S.fam.id;
      if (!ls.get(k)) { ls.set(k, "1"); celebrate(); }
    }
    document.querySelectorAll("img[data-fail]").forEach(i => i.addEventListener("error", () => {
      const d = document.createElement("div"); d.className = "imgfail"; d.textContent = "Photo nahi khul paayi";
      i.replaceWith(d);
    }, { once:true }));
  }

  /* ================= sheets ================= */
  const scrim = $("#scrim"), sheet = $("#sheet");
  let lastFocus = null;
  /* Phone back button: every open sheet and every tab away from Photos gets a history entry,
     so back closes the sheet (or leaves drawing), then returns to Photos, and only then exits. */
  let ignorePop = 0;
  const hstate = () => (history.state && history.state.fkd) || null;
  function openSheet(html){
    if (scrim.hidden) { lastFocus = document.activeElement; try { history.pushState({ fkd:"sheet" }, ""); } catch {} }
    sheet.innerHTML = html; scrim.hidden = false;
    const f = sheet.querySelector("textarea, input:not([type=radio]):not([type=checkbox]), button"); if (f) f.focus();
  }
  function closeSheet(fromPop){
    const wasOpen = !scrim.hidden;
    S.sheetPost = null; scrim.hidden = true; sheet.innerHTML = "";
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    if (fromPop !== true && wasOpen && hstate() === "sheet") { ignorePop++; history.back(); }
  }
  window.addEventListener("popstate", () => {
    if (ignorePop) { ignorePop--; if (!scrim.hidden && hstate() !== "sheet") { try { history.pushState({ fkd:"sheet" }, ""); } catch {} } return; }
    if (!scrim.hidden) {
      if ($("#pad") && S.sheetPost) { try { history.pushState({ fkd:"sheet" }, ""); } catch {} refreshView(); return; } // leave drawing, keep the photo open
      closeSheet(true); return;
    }
    if (!$("#app").hidden && S.mode !== "photos") goMode("photos", true);
  });
  function goMode(m, fromPop){
    const wasPhotos = S.mode === "photos";
    S.mode = m; S.filter = "all"; ls.set("fkd-mode", S.mode); render(); window.scrollTo(0, 0);
    if (fromPop === true) return;
    if (wasPhotos && m !== "photos") { try { history.pushState({ fkd:"tab" }, ""); } catch {} }
    else if (!wasPhotos && m === "photos" && hstate() === "tab") { ignorePop++; history.back(); }
  }
  scrim.addEventListener("click", e => { if (e.target === scrim) { S.sheetPost = null; closeSheet(); return; } const t = e.target.closest("[data-vact]"); if (t) viewAction(t); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !scrim.hidden) closeSheet(); });

  function compress(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        const max = 1280, s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(im.naturalWidth*s); c.height = Math.round(im.naturalHeight*s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/jpeg", 0.82);
      };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
      im.src = url;
    });
  }

          ${c.member === S.me ? `<button type="button" class="x" data-vact="delc" data-id="${esc(c.id)}">hatao</button>` : ""}</div></div>`).join("")}</div>` : ""}
        <form class="row" id="cf"><input class="field" id="ci" maxlength="300" placeholder="Kuch kaho…" aria-label="Comment likho" autocomplete="off"><button type="submit" class="btn pri" style="flex:none">Bhejo</button></form>
        <p class="err" id="vErr"></p>
      </section>
      <section class="vg foot">
        <button type="button" class="btn" data-vact="close">Band karo</button>
        ${p.member === S.me ? `<button type="button" class="dangerlink" data-vact="delpost">Yeh photo hatao</button>` : ""}
      </section>`;
    $("#ci").value = keep;
    decorateStamps(box);
    $("#cf").onsubmit = async e => {
      e.preventDefault();
      const body = $("#ci").value.trim().slice(0, 300); if (!body) return;
      const row = { id:uid(), family_id:S.fam.id, post_id:p.id, member:S.me, body, ts:new Date().toISOString() };
      $("#ci").value = "";
      S.comments.push(row); SFX.play("comment"); refreshView(); render();
      const { error } = await S.sb.from("comments").insert({ id:row.id, family_id:row.family_id, post_id:row.post_id, member:row.member, body });
      if (error) { S.comments = S.comments.filter(c => c !== row); refreshView(); render(); $("#vErr").textContent = "Comment nahi gaya. Dobara try karo."; }
    };
  }
  async function viewAction(t){
    const a = t.dataset.vact, p = S.posts.find(x => x.id === S.sheetPost); if (!p) return;
    if (a === "close") { S.sheetPost = null; closeSheet(); }
    else if (a === "stamp") {
      const k = t.dataset.k, has = S.preacts.find(r => r.post_id === p.id && r.kind === k && r.member === S.me);
      S.preacts = has ? S.preacts.filter(r => r !== has) : [...S.preacts, { post_id:p.id, member:S.me, kind:k }];
      SFX.play(has ? "remove" : "stamp");
      refreshView(); render();
      const { error } = has
        ? await S.sb.from("photo_reactions").delete().eq("post_id", p.id).eq("member", S.me).eq("kind", k)
        : await S.sb.from("photo_reactions").insert({ family_id:S.fam.id, post_id:p.id, member:S.me, kind:k });
      if (error && !/duplicate|23505/i.test(String(error.message || error.code))) loadDay(true);
    }
    else if (a === "hidedd") { S.hideDoodles = !S.hideDoodles; refreshView(); }
    else if (a === "deldd") {
      const mineIds = S.doodles.filter(d => d.post_id === p.id && d.member === S.me).map(d => d.id);
      S.doodles = S.doodles.filter(d => !mineIds.includes(d.id)); SFX.play("remove"); refreshView(); render();
      await S.sb.from("doodles").delete().in("id", mineIds);
    }
    else if (a === "delc") {
      const id = t.dataset.id; S.comments = S.comments.filter(c => c.id !== id); SFX.play("remove"); refreshView(); render();
      await S.sb.from("comments").delete().eq("id", id);
    }
    else if (a === "delpost") {
      if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "Pakka hatana hai?"; return; }
      const { error } = await S.sb.from("posts").delete().eq("id", p.id);
      if (error) { $("#vErr").textContent = "Hata nahi paaye. Dobara try karo."; return; }
      S.sheetPost = null; closeSheet(); SFX.play("remove"); loadDay(true);
    }
    else if (a === "doodle") doodleMode(p);
  }
  const PENS = ["#FFFFFF","#F99D1B","#DA525D","#064F6E","#1F1C12"];
  async function doodleMode(p){
    const box = $("#vs"); if (!box) return;
    box.innerHTML = `<h2>Photo pe kuch banao</h2>
      <p class="small">Ungli se banao: dil, moonchh, tareef. Sabko dikhega.</p>
      <div class="big"><span class="pw draw">${img(p, "Photo")}<svg id="pad" class="dd" aria-label="Doodle banane ki jagah"></svg></span></div>
      <div class="pens" id="pens">${PENS.map((c, i) => `<button type="button" data-c="${c}" style="background:${c}" aria-label="Rang ${i+1}" aria-pressed="${i===0}"></button>`).join("")}
        <button type="button" class="linkish" id="du" style="margin-left:auto">Undo</button></div>
      <p class="err" id="dErr"></p>
      <div class="row"><button type="button" class="btn" id="dx">Rehne do</button><button type="button" class="btn pri" id="ds" disabled>Chipka do</button></div>`;
    $("#dx").onclick = () => refreshView();
    const im = box.querySelector(".pw img");
    try { if (!im.complete) await new Promise((r, j) => { im.onload = r; im.onerror = j; }); }
    catch { $("#dErr").textContent = "Photo load nahi hui."; return; }
    const W = 1000, H = Math.max(1, Math.round(1000 * (im.naturalHeight || 750) / (im.naturalWidth || 1000)));
    const svg = $("#pad"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
    let color = PENS[0];
    $("#pens").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; color = b.dataset.c; $("#pens").querySelectorAll("[data-c]").forEach(x => x.setAttribute("aria-pressed", x === b)); };
    let pad;
    try { pad = await drawPad(svg, W, H, { size: 16, color: () => color, onChange: n => { $("#ds").disabled = !n; } }); }
    catch { $("#dErr").textContent = "Drawing tool load nahi hua. Net check karo."; return; }
    $("#du").onclick = () => pad.undo();
    $("#ds").onclick = async () => {
      const strokes = pad.strokes.map(s => ({ d: s.d, c: s.c }));
      const row = { id:uid(), family_id:S.fam.id, post_id:p.id, member:S.me, vb:`${W} ${H}`, strokes };
      if (JSON.stringify(strokes).length > 55000) { $("#dErr").textContent = "Doodle bahut bada ho gaya. Thoda kam banao."; return; }
      $("#ds").disabled = true;
      const { error } = await S.sb.from("doodles").insert(row);
      if (error) { $("#dErr").textContent = "Save nahi hua. Dobara try karo."; $("#ds").disabled = false; return; }
      S.doodles.push(Object.assign({ ts:new Date().toISOString() }, row)); S.hideDoodles = false; SFX.play("doodle"); refreshView(); render();
    };
  }

  async function setReminder(h){
    const me = meM();
    const note = t => { S.remindNote = t; const n = $("#rnote"); if (n) n.textContent = t; };
    if (h === null) {
      await S.sb.from("members").update({ remind_at:null }).eq("id", me.id);
      me.remind_at = null; note("Reminder band. Jab chaho phir chalu kar lena."); render(); return;
    }
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    if (!cfg.vapidPublicKey) return note("Reminders abhi set up nahi hue. Shiv se kaho README ka reminder wala step kar de.");
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return note(ios && !standalone ? "iPhone pe pehle Share > Add to Home Screen karo, phir wahan se app kholke yeh chuno." : "Is browser mein reminder nahi chal sakte. Chrome mein kholke try karo.");
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") return note("Notification ki permission nahi mili. Phone ki settings mein is site ko allow karo.");
      const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, j) => setTimeout(() => j(new Error("sw")), 8000))]);
      const key = Uint8Array.from(atob(cfg.vapidPublicKey.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((cfg.vapidPublicKey.length + 3) % 4)), c => c.charCodeAt(0));
      const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:key }));
      const j = sub.toJSON();
      const a = await S.sb.from("push_subs").upsert({ endpoint:j.endpoint, family_id:S.fam.id, member:me.id, p256dh:j.keys.p256dh, auth:j.keys.auth }, { onConflict:"endpoint" });
      const b = await S.sb.from("members").update({ remind_at:h }).eq("id", me.id);
      if (a.error || b.error) return note("Save nahi hua. Dobara try karo.");
      me.remind_at = h; SFX.play("ting"); note(`Ho gaya! Roz ${REMIND.find(r => r[1] === h)[0].toLowerCase()} baje yaad dilayenge, agar tab tak kuch nahi daala.`); render();
    } catch { note("Reminder chalu nahi ho paaya. Thodi der baad dobara try karo."); }
  }

  async function toggleReact(cid, kind){
    const has = S.reacts.find(r => r.confession_id === cid && r.kind === kind && r.member === S.me);
    const before = S.reacts;
    S.reacts = has ? S.reacts.filter(r => r !== has) : [...S.reacts, { confession_id:cid, member:S.me, kind }];
    SFX.play(has ? "remove" : "react");
    render();
    const { error } = has
      ? await S.sb.from("reactions").delete().eq("confession_id", cid).eq("member", S.me).eq("kind", kind)
      : await S.sb.from("reactions").insert({ family_id:S.fam.id, confession_id:cid, member:S.me, kind });
    if (error && !/duplicate|23505/i.test(String(error.message || error.code))) { S.reacts = before; render(); }
  }

  let armedChit = null;
  async function deleteChit(btn){
    const id = btn.dataset.id;
    if (armedChit !== id) { armedChit = id; btn.textContent = "Pakka hatana hai?"; btn.classList.add("armed"); return; }
    armedChit = null; btn.disabled = true;
    const { error } = await S.sb.from("confessions").delete().eq("id", id);
    if (error) { btn.disabled = false; btn.textContent = "Hata nahi paaye"; return; }
    S.conf = S.conf.filter(c => c.id !== id); SFX.play("remove"); render();
  }

  async function copyLink(btn){
    const link = inviteLink();
    try { await navigator.clipboard.writeText(link); btn.textContent = "Copy ho gaya"; }
    catch { openSheet(`<h2>Yeh link bhejo</h2><input class="field" value="${esc(link)}" readonly aria-label="Invite link"><button type="button" class="btn" data-close>Band karo</button>`); sheet.querySelector("[data-close]").onclick = closeSheet; sheet.querySelector("input").select(); }
  }

  /* ================= events ================= */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]"); if (!t || sheet.contains(t) || !S.sb || $("#app").hidden) return;
    const a = t.dataset.act;
    if (a !== "delchit" && armedChit) armedChit = null;
    if (a === "prev") { S.day = shiftDay(S.day, -1); loadDay(); }
    else if (a === "next") { if (S.day !== todayKey()) { S.day = shiftDay(S.day, 1); loadDay(); } }
    else if (a === "mode") goMode(t.dataset.m);
    else if (a === "filter") { S.filter = (S.filter === t.dataset.k && t.dataset.k !== "all") ? "all" : t.dataset.k; render(); }
    else if (a === "view") { S.view = t.dataset.v; render(); }
    else if (a === "add") S.mode === "parivaar" ? addMemberSheet() : S.mode === "dil" ? dilSheet(false) : addPhotoSheet();
    else if (a === "sawaal") dilSheet(true);
    else if (a === "open") viewSheet(t.dataset.id);
    else if (a === "react") toggleReact(t.dataset.id, t.dataset.k);
    else if (a === "delchit") deleteChit(t);
    else if (a === "relpick") relSheet(t.dataset.id);
    else if (a === "acceptrel") setRelation(t.dataset.id, t.dataset.l).then(ok => { if (ok) SFX.play("ting"); render(); });
    else if (a === "alerts") { ls.set("fkd-alerts", t.dataset.v); render(); if (t.dataset.v === "all") SFX.play("ting"); }
    else if (a === "sfx") SFX.play(t.dataset.k);
    else if (a === "editme") editMeSheet();
    else if (a === "drawmark") markSheet();
    else if (a === "install") doInstall();
    else if (a === "installx") { ls.set("fkd-install-x", "1"); render(); }
    else if (a === "remind") setReminder(t.dataset.h === "" ? null : Number(t.dataset.h));
    else if (a === "leaveself") confirmSheet("Parivaar chhodna hai?", "Aapka naam, photos, comments aur doodles hat jayenge, aur aapki dil ki baatein Gupt ban jayengi. Yeh wapas nahi hoga.", "Haan, chhodo", async () => {
      const { error } = await S.sb.from("members").delete().eq("id", S.me);
      if (error) return;
      ls.del("fkd-me"); ls.del("fkd-code"); location.href = location.pathname;
    });
    else if (a === "renamefam") renameFamSheet();
    else if (a === "copylink") copyLink(t);
    else if (a === "switchuser") confirmSheet("User badlo?", "Is phone se aap log out ho jaoge. Aapki photos aur baatein waise hi rahengi.", "Haan, badlo", () => { ls.del("fkd-me"); S.me = null; S.rel = {}; S.relIn = []; onbWho(false); });
    else if (a === "leavefam") confirmSheet("Doosre parivaar mein jao?", `Is phone se ${esc(S.fam.name)} hat jayega. Wapas aane ke liye code chahiye hoga: <b>${esc(S.fam.code)}</b>`, "Haan, jao", () => { ls.del("fkd-me"); ls.del("fkd-code"); location.href = location.pathname; });
  });

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  boot();
})();
</script>
</body>
</html>
